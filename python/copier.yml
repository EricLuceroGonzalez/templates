# Plantilla: proyecto Python con uv
# Uso: uvx copier copy ~/Developer/tools/templates/python <destino>
_subdirectory: template
_templates_suffix: .jinja

project_name:
  type: str
  help: Nombre del proyecto (kebab-case, p. ej. analisis-encuestas)
  validator: "{% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}Usa minúsculas, números y guiones{% endif %}"

package_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false

description:
  type: str
  help: Descripción en una línea
  default: ""

project_type:
  type: str
  help: Tipo de proyecto
  choices:
    Aplicación o librería: app
    Investigación (datos, notebooks, resultados): research
  default: app

python_version:
  type: str
  help: Versión de Python
  default: "3.12"

author_name:
  type: str
  help: Autor
  default: Eric Lucero González

license:
  type: str
  help: Licencia
  choices: [MIT, ninguna]
  default: MIT

year:
  type: str
  default: "{{ '%Y' | strftime }}"
  when: false
